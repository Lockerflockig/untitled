<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escape the Beams</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat wide">
          <span class="label">Trefferpunkte<span id="lives"></span></span>
          <span id="hp-text"></span>
          <div class="bar"><div id="hp-bar"></div></div>
        </div>
        <div class="stat"><span class="label" id="room"></span><span id="objective"></span></div>
        <div class="stat"><span class="label">Punkte</span><span id="score">0</span></div>
        <div class="stat"><span class="label">Multiplikator</span><span id="multiplier"></span></div>
        <div class="stat"><span class="label">Ebene</span><span id="level"></span></div>
        <div class="stat right"><span class="label">Waffe</span><span id="weapon"></span></div>
        <div class="stat cooldowns">
          <span class="label">Dash <span id="dashes"></span></span>
          <span class="label">Kick</span>
          <div class="bar"><div id="kick-bar"></div></div>
        </div>
      </header>
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
